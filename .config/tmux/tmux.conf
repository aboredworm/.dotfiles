set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0

set -g mode-keys vi
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g status-style 'bg=#333333 fg=#5eacd3'
set-option -g history-limit 20000

bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1
set -g repeat-time 0


# Vim style pane selection
bind ^ last-window
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# vim-like pane switching

bind -r D neww -c "#{pane_current_path}" "nvim TODO.md"

# I like panes inheriting from window rather than session
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

bind-key m run-shell "~/.local/bin/tmux-background rmpc rmpc"
bind-key t run-shell "~/.local/bin/tmux-background dooit dooit"
bind-key n run-shell "~/.local/bin/tmux-background notes ~/.local/bin/nvim-notes ~/work/notes"
bind-key b switch-client -l
